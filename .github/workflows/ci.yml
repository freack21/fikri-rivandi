name: CI

on:
  push:
    branches: [neo-brutalism, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check setup.sh
        run: |
          bash -n deploy/coolify/setup.sh
          shellcheck deploy/coolify/setup.sh
      - name: Build Docker image
        run: docker build --tag fikri-rivandi:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name web -p 8080:8080 fikri-rivandi:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/works | grep -q '<div id="root">'
          test "$(docker exec web id -u)" != "0"
          docker rm -f web

  # Deploys only after tests pass on the production branch (neo-brutalism). Turn off Coolify's own
  # auto-deploy on push, otherwise every push is deployed twice (and untested).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/neo-brutalism'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_DEPLOY_WEBHOOK / COOLIFY_TOKEN secrets are not set; skipping deploy."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_DEPLOY_WEBHOOK"
