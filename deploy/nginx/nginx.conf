# Serves the built Vite SPA as an unprivileged user on port 8080.
# Coolify's Traefik terminates TLS and forwards plain HTTP to this container.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Writable temp paths for a non-root user.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects must not leak the internal port (Traefik serves https://<domain> on 443).
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Vite emits content-hashed files here: cache them for a year.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Other static files (images, CV, favicon) change rarely but are not hashed.
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|pdf|woff2?|txt|xml)$ {
      add_header Cache-Control "public, max-age=604800";
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # SPA fallback: client-side routes such as /works are served by index.html.
    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
