<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#22d3ee" />
  
  <!-- Brutalist Window/Dashboard -->
  <rect x="50" y="50" width="500" height="300" fill="#ffffff" stroke="#000000" stroke-width="8" />
  
  <!-- Window Header -->
  <rect x="50" y="50" width="500" height="40" fill="#000000" />
  <circle cx="70" cy="70" r="6" fill="#FF3366" />
  <circle cx="90" cy="70" r="6" fill="#fde047" />
  <circle cx="110" cy="70" r="6" fill="#22d3ee" />

  <!-- Sidebar -->
  <rect x="50" y="90" width="120" height="260" fill="#f4f4f0" stroke="#000000" stroke-width="4" />
  <rect x="70" y="110" width="80" height="15" fill="#000000" />
  <rect x="70" y="140" width="60" height="15" fill="#a3e635" stroke="#000000" stroke-width="2" />
  <rect x="70" y="170" width="70" height="15" fill="#000000" />
  <rect x="70" y="200" width="50" height="15" fill="#000000" />
  
  <!-- Main Content Area Data Cards -->
  <rect x="200" y="110" width="140" height="80" fill="#FF3366" stroke="#000000" stroke-width="4" />
  <rect x="370" y="110" width="140" height="80" fill="#fde047" stroke="#000000" stroke-width="4" />
  
  <!-- Main Graph -->
  <rect x="200" y="210" width="310" height="120" fill="#ffffff" stroke="#000000" stroke-width="4" />
  <path d="M210 310 L250 250 L300 280 L350 220 L400 260 L450 230 L500 280" fill="none" stroke="#22d3ee" stroke-width="6" />
  <circle cx="350" cy="220" r="8" fill="#FF3366" stroke="#000000" stroke-width="3" />
</svg>
