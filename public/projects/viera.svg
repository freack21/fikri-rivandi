<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#fde047" />
  
  <!-- Brutalist Window/Dashboard -->
  <rect x="50" y="50" width="500" height="300" fill="#ffffff" stroke="#000000" stroke-width="8" />
  
  <!-- Window Header -->
  <rect x="50" y="50" width="500" height="40" fill="#000000" />
  <circle cx="70" cy="70" r="6" fill="#FF3366" />
  <circle cx="90" cy="70" r="6" fill="#fde047" />
  <circle cx="110" cy="70" r="6" fill="#22d3ee" />
  
  <!-- Content: Bar Chart -->
  <rect x="90" y="150" width="40" height="150" fill="#FF3366" stroke="#000000" stroke-width="4" />
  <rect x="150" y="200" width="40" height="100" fill="#22d3ee" stroke="#000000" stroke-width="4" />
  <rect x="210" y="100" width="40" height="200" fill="#a3e635" stroke="#000000" stroke-width="4" />
  <rect x="270" y="180" width="40" height="120" fill="#FF3366" stroke="#000000" stroke-width="4" />
  
  <!-- Content: Text Blocks -->
  <rect x="350" y="120" width="150" height="20" fill="#000000" />
  <rect x="350" y="160" width="100" height="20" fill="#000000" />
  <rect x="350" y="200" width="130" height="20" fill="#000000" />
  
  <!-- Floating Abstract Shape -->
  <polygon points="450,250 520,320 380,320" fill="#22d3ee" stroke="#000000" stroke-width="6" />
</svg>
